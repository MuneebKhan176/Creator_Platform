spring.application.name=application
server.port=${SERVER_PORT:4000}

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- JWT ----
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ---- Mail (SMTP) ----
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}

# ---- Cookies ----
# Set to true in production (HTTPS). Keep false for local HTTP development.
app.cookie.secure=${COOKIE_SECURE:false}

# ---- CORS ----
# Origin of the TypeScript frontend (e.g. a local dev server / live-server URL)
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}