spring.application.name=application
server.port=${SERVER_PORT:4000}

# ---- Database (PostgreSQL) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- JWT ----
# ---- JWT / Sessions ----
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration-ms=${ACCESS_TOKEN_EXPIRATION_MS:900000}
app.refresh-token.expiration-ms=${REFRESH_TOKEN_EXPIRATION_MS:2592000000}

# ---- Mail (SMTP) ----
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM}

# ---- Cookies ----
# Set to true in production (HTTPS). Keep false for local HTTP development.
app.cookie.secure=${COOKIE_SECURE:false}

# ---- CORS ----
# Origin of the TypeScript frontend (e.g. a local dev server / live-server URL)
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5500}


# ---- Password reset ----
app.password-reset.expiration-ms=${PASSWORD_RESET_EXPIRATION_MS:1800000}
app.frontend.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5500/reset-password}


# ---- Redis ----
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ---- Rate limiting ----
app.rate-limit.register.max=${RATE_LIMIT_REGISTER_MAX:5}
app.rate-limit.register.window-seconds=${RATE_LIMIT_REGISTER_WINDOW_SECONDS:3600}
app.rate-limit.login-ip.max=${RATE_LIMIT_LOGIN_IP_MAX:20}
app.rate-limit.login-ip.window-seconds=${RATE_LIMIT_LOGIN_IP_WINDOW_SECONDS:900}
app.rate-limit.verify.max=${RATE_LIMIT_VERIFY_MAX:10}
app.rate-limit.verify.window-seconds=${RATE_LIMIT_VERIFY_WINDOW_SECONDS:600}
app.rate-limit.resend.max=${RATE_LIMIT_RESEND_MAX:3}
app.rate-limit.resend.window-seconds=${RATE_LIMIT_RESEND_WINDOW_SECONDS:3600}
app.rate-limit.forgot-password.max=${RATE_LIMIT_FORGOT_PASSWORD_MAX:3}
app.rate-limit.forgot-password.window-seconds=${RATE_LIMIT_FORGOT_PASSWORD_WINDOW_SECONDS:3600}


# ---- Cloud Storage (Cloudflare R2, S3-compatible) ----
# ---- Cloud Storage (Cloudflare R2, S3-compatible) ----
app.storage.account-id=${CLOUD_ACCOUNT_ID}
app.storage.access-key-id=${ACCESS_KEY_ID}
app.storage.secret-access-key=${SECRET_ACCESS_KEY}
app.storage.bucket-name=${BUCKET_NAME}
app.storage.public-base-url=${CLOUD_PUBLIC_URI}

# ---- Multipart uploads ----
# CloudStorageService rejects files over 5MB itself, but Spring's own default
# multipart cap (1MB/file, 10MB/request) would reject them first if left as-is.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB