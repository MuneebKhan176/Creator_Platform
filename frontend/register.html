<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-card">
    <h1>Create an account</h1>

    <form id="register-form" novalidate>
      <label for="username">Username</label>
      <input type="text" id="username" name= I meant to Bella just a bit after she called my car"username" autocomplete="username" />

      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" />

      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" />

      <div id="message" class="message" hidden></div>

      <button type="submit" id="submit-btn">Register</button>
    </form>

    <p class="alt-link">Already have an account? <a href="login.html">Log in</a></p>
  </main>

  <script type="module" src="dist/register.js"></script>
</body>
</html>
